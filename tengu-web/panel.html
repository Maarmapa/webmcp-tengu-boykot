<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sala — Tengu OS</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--black:#060503;--dark:#12100c;--dark2:#1a1510;--gold:#c8921a;--cream:#e8e0d0;--cream2:#b8ae9e;--ok:#5C9E92;--bad:#b8574c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--black);color:var(--cream);font-family:'Cormorant Garamond',serif;padding:28px 18px 80px;max-width:860px;margin:0 auto}
h1{font-weight:300;font-size:30px}h1 em{color:var(--gold);font-style:italic}
.mono{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
input,button,select{font-family:'DM Mono',monospace;font-size:12px;background:var(--dark2);border:1px solid rgba(200,146,26,.3);color:var(--cream);padding:9px 12px;border-radius:4px}
button{cursor:pointer}button:hover{border-color:var(--gold)}
.card{background:var(--dark);border:1px solid rgba(200,146,26,.14);border-radius:8px;padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.hora{font-family:'DM Mono',monospace;font-size:16px;color:var(--gold);min-width:56px}
.nombre{font-size:19px}.meta{font-family:'DM Mono',monospace;font-size:10px;color:var(--cream2);margin-top:2px}
.estado{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;padding:4px 10px;border-radius:20px;border:1px solid rgba(200,146,26,.35)}
.estado.confirmada{color:var(--ok);border-color:var(--ok)}
.estado.cancelada,.estado.no_show{color:var(--bad);border-color:var(--bad)}
.acciones{display:flex;gap:6px;flex-wrap:wrap}
.acciones button{padding:6px 10px;font-size:10px}
#vacio{color:var(--cream2);padding:30px 0;text-align:center}
.aviso{font-family:'DM Mono',monospace;font-size:9px;color:rgba(200,146,26,.55);letter-spacing:.12em;text-transform:uppercase;margin-top:26px;text-align:center}
</style>
</head>
<body>
<div class="top">
  <div>
    <p class="mono" style="color:var(--gold)">Tengu OS · Panel de sala · v0</p>
    <h1>Reservas del <em>día</em></h1>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <button id="tabRes" onclick="vista('reservas')" style="border-color:var(--gold);color:var(--gold)">Reservas</button>
    <button id="tabEv" onclick="vista('eventos')">Experiencias</button>
    <input type="date" id="fecha">
    <button onclick="cargar()">Ver</button>
  </div>
</div>
<div id="lista"><p id="vacio">Ingresa la clave para cargar el día.</p></div>
<p class="aviso">Sistema en marcha blanca — las solicitudes de agentes y pruebas aparecen aquí. Confirmar una reserva NO avisa aún al comensal (fase notificaciones).</p>
<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

const $=id=>document.getElementById(id);
function clave(){
  let c=sessionStorage.getItem('tsala');
  if(!c){ c=prompt('Clave del panel:')||''; sessionStorage.setItem('tsala',c); }
  return c;
}
function hdr(){ return {'Authorization':'Basic '+btoa('tengu:'+clave()),'Content-Type':'application/json'}; }
async function cargar(){
  const f=$('fecha').value;
  const r=await fetch('/api/panel'+(f?('?fecha='+f):''),{headers:hdr()});
  if(r.status===401){ sessionStorage.removeItem('tsala'); $('lista').innerHTML='<p id="vacio">Clave incorrecta. Recarga e intenta de nuevo.</p>'; return; }
  const j=await r.json();
  if(!$('fecha').value && j.fecha) $('fecha').value=j.fecha;
  const rs=j.reservas||[];
  if(!rs.length){ $('lista').innerHTML='<p id="vacio">Sin reservas para '+(j.fecha||'ese día')+'.</p>'; return; }
  $('lista').innerHTML=rs.map(x=>`
    <div class="card">
      <div style="display:flex;gap:14px;align-items:center">
        <span class="hora">${x.hora}</span>
        <div>
          <div class="nombre">${esc(x.nombre)} · ${esc(x.personas)}p</div>
          <div class="meta">${esc(x.codigo)} · ${esc(x.origen)}${x.telefono?(' · '+esc(x.telefono)):''}${x.notas?(' · '+esc(x.notas)):''}</div>
        </div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <span class="estado ${x.estado}">${x.estado}</span>
        <div class="acciones">
          <button onclick="estado('${x.codigo}','confirmada')">Confirmar</button>
          <button onclick="estado('${x.codigo}','cancelada')">Cancelar</button>
          <button onclick="estado('${x.codigo}','no_show')">No-show</button>
          <button onclick="estado('${x.codigo}','completada')">Completada</button>
        </div>
      </div>
    </div>`).join('');
}
async function estado(codigo,estado){
  const r=await fetch('/api/panel',{method:'POST',headers:hdr(),body:JSON.stringify({codigo,estado})});
  const j=await r.json();
  if(j.error) alert(j.error); else cargar();
}
function vista(v){
  const res=v==='reservas';
  $('tabRes').style.borderColor=res?'var(--gold)':'rgba(200,146,26,.3)';
  $('tabRes').style.color=res?'var(--gold)':'var(--cream)';
  $('tabEv').style.borderColor=res?'rgba(200,146,26,.3)':'var(--gold)';
  $('tabEv').style.color=res?'var(--cream)':'var(--gold)';
  $('fecha').style.display=res?'':'none';
  res?cargar():cargarEventos();
}
const clp=n=>'$'+Number(n||0).toLocaleString('es-CL');
async function cargarEventos(){
  const r=await fetch('/api/panel?vista=eventos',{headers:hdr()});
  if(r.status===401){ sessionStorage.removeItem('tsala'); location.reload(); return; }
  const j=await r.json();
  const evs=j.eventos||[];
  const nuevo='<div style="margin-bottom:12px"><button onclick="nuevoEvento()">+ Nueva experiencia</button></div>';
  if(!evs.length){ $('lista').innerHTML=nuevo+'<p id="vacio">Sin experiencias creadas.</p>'; return; }
  $('lista').innerHTML=nuevo+evs.map(ev=>{
    const zonas=(ev.zonas||[]).map(z=>`${esc(z.nombre)}: ${esc(z.vendidos)}/${esc(z.cupos)} · ${clp(z.precio)}`).join(' &nbsp;|&nbsp; ');
    const editor=`<div id="ed-${ev.slug}" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid rgba(200,146,26,.15)">
      <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:8px">
        <input id="n-${ev.slug}" value="${esc(ev.nombre)}" placeholder="Nombre">
        <input id="f-${ev.slug}" type="date" value="${ev.fecha}">
        <input id="h-${ev.slug}" value="${ev.hora}" placeholder="20:00">
      </div>
      <input id="s-${ev.slug}" value="${(ev.subtitulo||'').replace(/"/g,'&quot;')}" placeholder="Subtitulo" style="width:100%;margin-bottom:8px">
      <textarea id="d-${ev.slug}" placeholder="Descripcion" style="width:100%;min-height:56px;margin-bottom:8px;font-family:'Cormorant Garamond',serif;font-size:15px">${(ev.descripcion||'').replace(/</g,'&lt;')}</textarea>
      <button onclick="guardarEvento('${ev.slug}')">Guardar evento</button>
      <div style="margin-top:14px">
        ${(ev.zonas||[]).map(z=>`
          <div style="display:grid;grid-template-columns:1.1fr 2fr 1fr .8fr auto;gap:8px;margin-bottom:8px;align-items:center">
            <input id="zn-${z.id}" value="${esc(z.nombre)}" placeholder="Zona">
            <input id="zd-${z.id}" value="${(z.descripcion||'').replace(/"/g,'&quot;')}" placeholder="Descripcion">
            <input id="zp-${z.id}" type="number" value="${z.precio}" placeholder="Precio">
            <input id="zc-${z.id}" type="number" value="${z.cupos}" placeholder="Cupos">
            <button onclick="guardarZona('${z.id}')">Guardar</button>
          </div>`).join('')}
      </div>
    </div>`;
    const tickets=(ev.tickets||[]).map(t=>`
      <div class="card" style="margin:6px 0 0;padding:10px 14px">
        <div><div class="nombre" style="font-size:16px">${esc(t.nombre)} · ${esc(t.cantidad)}p · ${clp(t.monto)}</div>
        <div class="meta">${t.codigo} · ${t.zona||''}${t.telefono?(' · '+t.telefono):''}${t.email?(' · '+t.email):''}</div></div>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="estado ${t.estado==='pagado'?'confirmada':(t.estado==='anulado'?'cancelada':'')}">${t.estado}</span>
          <div class="acciones">
            <button onclick="ticket('${t.codigo}','pagado')">Pagado</button>
            <button onclick="ticket('${t.codigo}','usado')">Usado</button>
            <button onclick="ticket('${t.codigo}','anulado')">Anular</button>
          </div>
        </div>
      </div>`).join('');
    return `<div class="card" style="display:block">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
        <div>
          <div class="nombre">${(ev.nombre||'').replace(/</g,'&lt;')}</div>
          <div class="meta">${ev.fecha} · ${ev.hora} · ${zonas}</div>
          <div class="meta" style="color:var(--gold);margin-top:4px">Recaudado ${clp(ev.recaudado)} &nbsp;·&nbsp; Comprometido ${clp(ev.comprometido)}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="estado ${ev.estado==='publicado'?'confirmada':''}">${ev.estado}</span>
          <div class="acciones">
            <button onclick="toggleEd('${ev.slug}')">Editar</button>
            <button onclick="evento('${ev.slug}','publicado')">Publicar</button>
            <button onclick="evento('${ev.slug}','borrador')">Despublicar</button>
            <button onclick="evento('${ev.slug}','cerrado')">Cerrar</button>
          </div>
        </div>
      </div>
      ${editor}
      ${tickets?('<div style="margin-top:12px">'+tickets+'</div>'):'<p class="meta" style="margin-top:10px">Sin ventas todavía.</p>'}
    </div>`;
  }).join('');
}
function toggleEd(slug){ const d=$('ed-'+slug); d.style.display = d.style.display==='none'?'block':'none'; }
async function post(body){
  const r=await fetch('/api/panel',{method:'POST',headers:hdr(),body:JSON.stringify(body)});
  return r.json();
}
async function guardarEvento(slug){
  const j=await post({accion:'guardar_evento',slug,nombre:$('n-'+slug).value,subtitulo:$('s-'+slug).value,
    descripcion:$('d-'+slug).value,fecha:$('f-'+slug).value,hora:$('h-'+slug).value});
  if(j.error) alert(j.error); else cargarEventos();
}
async function guardarZona(id){
  const j=await post({accion:'guardar_zona',zona:id,nombre:$('zn-'+id).value,descripcion:$('zd-'+id).value,
    precio:$('zp-'+id).value,cupos:$('zc-'+id).value});
  if(j.error) alert(j.error); else cargarEventos();
}
async function nuevoEvento(){
  const nombre=prompt('Nombre del evento:'); if(!nombre) return;
  const slug=prompt('Identificador para la URL (minusculas y guiones):'); if(!slug) return;
  const fecha=prompt('Fecha (AAAA-MM-DD):'); if(!fecha) return;
  const hora=prompt('Hora (HH:MM):','20:00'); if(!hora) return;
  const j=await post({accion:'crear_evento',slug,nombre,fecha,hora});
  if(j.error) alert(j.error); else cargarEventos();
}
async function evento(slug,estado){
  const r=await fetch('/api/panel',{method:'POST',headers:hdr(),body:JSON.stringify({evento:slug,estado})});
  const j=await r.json(); if(j.error) alert(j.error); else cargarEventos();
}
async function ticket(codigo,estado){
  const r=await fetch('/api/panel',{method:'POST',headers:hdr(),body:JSON.stringify({ticket:codigo,estado})});
  const j=await r.json(); if(j.error) alert(j.error); else cargarEventos();
}
cargar();
</script>
</body>
</html>
